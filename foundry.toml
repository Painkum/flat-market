[profile.default]
src = "contracts"
out = "forge-out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
robinhood_testnet = "${RH_RPC_URL}"
robinhood_mainnet = "${RH_MAINNET_RPC_URL}"
